<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 498" width="760" height="498" role="img" aria-labelledby="t d">
<title id="t">Time to build the same Fusion 360 part, with and without the fusion-fast-modeling skill</title>
<desc id="d">Without the advisor tool: the mean of the three small parts drops from 398 to 73 seconds (5.4 times faster); the piping spool from 1123 to 482 seconds (2.3 times faster).</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
  .grid { stroke: #e1e0d9; } .axis { stroke: #c3c2b7; }
  .s0 { fill: #898781; } .s1 { fill: #2a78d6; }
  .halo { stroke: #fcfcfb; stroke-width: 4px; stroke-linejoin: round; paint-order: stroke; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .halo { stroke: #1a1a19; }
    .grid { stroke: #2c2c2a; } .axis { stroke: #383835; } .s1 { fill: #5598e7; }
  }
</style>
<rect class="bg" width="760" height="498" rx="10"/>
<text class="ink" x="24" y="38" font-size="18" font-weight="600">Time to build the same part in Fusion 360</text>
<text class="ink2" x="24" y="60" font-size="13">Same prompts, same model, same grader, no advisor tool. Small parts: 398 s to 73 s.</text>
<text class="ink2" x="24" y="78" font-size="13">Piping spool: 1,123 s to 482 s.</text>
<rect class="s0" x="176" y="92" width="12" height="12" rx="3"/>
<text class="ink2" x="194" y="102" font-size="12">No skill</text>
<rect class="s1" x="280" y="92" width="12" height="12" rx="3"/>
<text class="ink2" x="298" y="102" font-size="12">Skill v2.3</text>
<line class="axis" x1="176.0" x2="176.0" y1="108" y2="410"/>
<text class="muted" x="176.0" y="428" font-size="11" text-anchor="middle">0 s</text>
<line class="grid" x1="242.3" x2="242.3" y1="108" y2="410"/>
<text class="muted" x="242.3" y="428" font-size="11" text-anchor="middle">200 s</text>
<line class="grid" x1="308.6" x2="308.6" y1="108" y2="410"/>
<text class="muted" x="308.6" y="428" font-size="11" text-anchor="middle">400 s</text>
<line class="grid" x1="374.9" x2="374.9" y1="108" y2="410"/>
<text class="muted" x="374.9" y="428" font-size="11" text-anchor="middle">600 s</text>
<line class="grid" x1="441.1" x2="441.1" y1="108" y2="410"/>
<text class="muted" x="441.1" y="428" font-size="11" text-anchor="middle">800 s</text>
<line class="grid" x1="507.4" x2="507.4" y1="108" y2="410"/>
<text class="muted" x="507.4" y="428" font-size="11" text-anchor="middle">1000 s</text>
<line class="grid" x1="573.7" x2="573.7" y1="108" y2="410"/>
<text class="muted" x="573.7" y="428" font-size="11" text-anchor="middle">1200 s</text>
<text class="muted" x="176" y="454" font-size="11">seconds from prompt to a finished, exported model (lower is better)</text>
<text class="ink" x="24" y="141.0" font-size="13" font-weight="600">Mean of 3 small parts</text>
<path class="s0" d="M176.0,118 h127.9 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-127.9 z"/>
<text class="ink halo" x="315.9" y="131" font-size="12" font-weight="600">398 s</text>
<path class="s1" d="M176.0,138 h20.2 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-20.2 z"/>
<text class="ink halo" x="208.2" y="151" font-size="12" font-weight="600">73 s<tspan class="ink2" font-weight="400"> · 5.4× faster</tspan></text>
<text class="ink" x="24" y="203.0" font-size="13" font-weight="400">Cable comb</text>
<line class="grid" x1="24" x2="736" y1="168.0" y2="168.0"/>
<path class="s0" d="M176.0,180 h116.1 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-116.1 z"/>
<text class="ink halo" x="304.1" y="193" font-size="12" font-weight="600">362 s</text>
<path class="s1" d="M176.0,200 h15.6 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-15.6 z"/>
<text class="ink halo" x="203.6" y="213" font-size="12" font-weight="600">59 s<tspan class="ink2" font-weight="400"> · 6.1× faster</tspan></text>
<text class="ink" x="24" y="265.0" font-size="13" font-weight="400">Wall hook</text>
<path class="s0" d="M176.0,242 h128.4 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-128.4 z"/>
<text class="ink halo" x="316.4" y="255" font-size="12" font-weight="600">400 s</text>
<path class="s1" d="M176.0,262 h23.1 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-23.1 z"/>
<text class="ink halo" x="211.1" y="275" font-size="12" font-weight="600">82 s<tspan class="ink2" font-weight="400"> · 4.9× faster</tspan></text>
<text class="ink" x="24" y="327.0" font-size="13" font-weight="400">Project box</text>
<path class="s0" d="M176.0,304 h139.3 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-139.3 z"/>
<text class="ink halo" x="327.3" y="317" font-size="12" font-weight="600">432 s</text>
<path class="s1" d="M176.0,324 h22.0 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-22.0 z"/>
<text class="ink halo" x="210.0" y="337" font-size="12" font-weight="600">78 s<tspan class="ink2" font-weight="400"> · 5.5× faster</tspan></text>
<text class="ink" x="24" y="389.0" font-size="13" font-weight="400">Piping spool (2 runs)</text>
<path class="s0" d="M176.0,366 h368.2 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-368.2 z"/>
<text class="ink halo" x="556.2" y="379" font-size="12" font-weight="600">1123 s</text>
<path class="s1" d="M176.0,386 h155.7 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-155.7 z"/>
<text class="ink halo" x="343.7" y="399" font-size="12" font-weight="600">482 s<tspan class="ink2" font-weight="400"> · 2.3× faster</tspan></text>
</svg>
